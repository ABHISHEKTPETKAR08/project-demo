
# Maven build pipeline

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: BuildMaven
  displayName: 'Build Maven'

  steps:

  # Step 1: Configure Java 21
  - task: JavaToolInstaller@0
    displayName: 'Set up JDK 21'
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # Step 2: Verify Java version
  - script: |
      java -version
      javac -version
      mvn -version
    displayName: 'Verify Java 21'

  # Step 3: Verify source code
  - script: |
      cat src/main/java/org/example/Main.java
    displayName: 'Verify GitHub source code'

  # Step 4: Build using Maven
  - task: Maven@4
    displayName: 'Maven Build'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
