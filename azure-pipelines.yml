
# Maven build pipeline

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Step 1: Configure Java 21 FIRST
- task: JavaToolInstaller@0
  displayName: 'Set up JDK 21'
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# Step 2: Verify Java version
- script: |
    java -version
    javac -version
    mvn -version
  displayName: 'Verify Java 21'

# Step 3: Verify source code from GitHub
- script: |
    echo "Current branch:"
    git branch --show-current

    echo "Latest commit:"
    git log -1 --oneline

    echo "Main.java contents:"
    cat src/main/java/org/example/Main.java

    echo "Searching for IO references:"
    grep -n "IO" src/main/java/org/example/Main.java || true
  displayName: 'Verify GitHub source code'
